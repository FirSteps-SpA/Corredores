name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    # Lint, tipos y tests unitarios, sin base de datos. Valores de relleno para el código que lee
    # las variables de Supabase; no se conecta a ningún proyecto real.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Sin `next build` aquí: prerenderizar el catálogo y generateStaticParams necesitan la base.
      # El build se hace en el job `rls`, contra Supabase local.

  rls:
    # Levanta Supabase local y corre scripts/test-rls.mjs (Auth, RLS y Storage) y, con la app
    # construida y corriendo, scripts/test-panel.mjs (panel /admin) y Playwright (e2e/). No usa
    # ningún proyecto remoto.
    # El nombre `rls` lo exige la protección de `main`.
    runs-on: ubuntu-latest
    # Contacto de prueba para el build y los tests del sitio público: WhatsApp e Instagram sí,
    # correo no (Playwright verifica que solo se muestre lo configurado).
    env:
      NEXT_PUBLIC_WHATSAPP: "56900000000"
      NEXT_PUBLIC_INSTAGRAM: gycmar_prueba
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # UF fija y sin consultar findic.cl: resultados de búsqueda deterministas (spec 6).
      UF_FUENTE: ninguna
      UF_RESPALDO: "40000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Versión fija: con `latest` la acción consulta la API de GitHub para
      # resolverla y a veces falla por límite de tasa ("rate limit exceeded").
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase --version
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:rls
      - run: npm ci
      # La app apunta al Supabase local del job.
      - name: Variables de Supabase local
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Levantar la app
        run: |
          npm start > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          cat next.log; exit 1
      - run: npm run test:panel
      # Playwright: navegador real para las fotos (compresión en el cliente, subida directa).
      - name: Caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Log de la app
        if: failure()
        run: cat next.log
